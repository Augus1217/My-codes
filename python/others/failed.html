

<html>

<head>


<title>學生成績線上查詢系統</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局樣式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            font-size: 14px; /* 調小整體字體大小 */
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 20px; /* 減少內邊距 */
            overflow: hidden;
        }

         .error-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

   

        .error-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            animation: shake 0.5s ease-in-out;
        }

        .error-icon svg {
            width: 100%;
            height: 100%;
        }

        .error-title {
            color: #e53e3e;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        .error-message {
            color: #4a5568;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        
        /* 頁眉樣式 */
        header {
            text-align: center;
            margin-bottom: 20px; /* 減少下邊距 */
            position: relative;
        }
        
                
        .student-info {
            background-color: #e0f2f1;
            padding: 10px; /* 減少內邊距 */
            border-radius: 10px;
            margin-bottom: 15px; /* 減少下邊距 */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px; /* 減少間距 */
        }
        
        .info-item {
            display: flex;
            align-items: center;
        }
        
        .info-label {
            color: #00796b;
            font-weight: bold;
            margin-right: 5px; /* 減少右邊距 */
            font-size: 0.9rem; /* 調小字體 */
        }
        
        .info-value {
            color: #0277bd;
            font-weight: bold;
            font-size: 0.9rem; /* 調小字體 */
        }
        
        /* 按鈕樣式 */
        .button-container {
            text-align: center;
            margin: 15px 0; /* 減少上下邊距 */
        }
        
        .toggle-btn {
            background: linear-gradient(to right, #00897b, #26a69a);
            color: white;
            border: none;
            padding: 8px 18px; /* 減少內邊距 */
            border-radius: 50px;
            font-size: 14px; /* 調小字體 */
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 6px; /* 減少間距 */
        }
        
        .toggle-btn:hover {
            background: linear-gradient(to right, #00796b, #00897b);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        /* 表格樣式 */
        .table-container {
            overflow-x: auto;
            margin: 15px 0; /* 減少上下邊距 */
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }
        
        th {
            background: linear-gradient(to right, #00897b, #26a69a);
            color: white;
            padding: 10px 8px; /* 減少內邊距 */
            text-align: center;
            font-weight: bold;
            position: sticky;
            top: 0;
            font-size: 0.85rem; /* 調小字體 */
        }
        
        td {
            padding: 8px 6px; /* 減少內邊距 */
            text-align: center;
            border-bottom: 1px solid #e0f2f1;
            font-size: 0.85rem; /* 調小字體 */
        }
        
        tr:nth-child(even) {
            background-color: #e0f7fa;
        }
        
        tr:hover {
            background-color: #b2ebf2;
            transition: background-color 0.2s ease;
        }
        
        /* 隱藏 div 預設樣式 */
        #testData {
            display: none;
            margin-top: 15px; /* 減少上邊距 */
            padding: 15px; /* 減少內邊距 */
            border-radius: 10px;
            background-color: rgba(224, 247, 250, 0.7);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        #testData h3 {
            color: #00796b;
            margin-bottom: 10px; /* 減少下邊距 */
            font-size: 1.2rem; /* 調小字體 */
        }
        
       
        
        /* 響應式設計 */
        @media (max-width: 768px) {
            .container {
                padding: 12px; /* 減少內邊距 */
            }
            
            header h1 {
                font-size: 1.5rem; /* 調小字體 */
            }
            
            .student-info {
                flex-direction: column;
                align-items: flex-start;
            }
            
            th, td {
                padding: 6px 4px; /* 減少內邊距 */
                font-size: 0.8rem; /* 調小字體 */
            }
            
            .chart-container {
                flex-direction: column;
            }
            
            .chart-item {
                min-width: 150px; /* 減少最小寬度 */
            }
        }
    </style>


</head>



<body bgcolor="#FFFFFF">




  <div  align=center>
   <div class="error-container" >
        <div class="error-icon" >
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="errorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#e53e3e;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#c53030;stop-opacity:1" />
                    </linearGradient>
                    <filter id="shadow">
                        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
                    </filter>
                </defs>
                
                <!-- 背景圓圈 -->
                <circle cx="60" cy="60" r="55" fill="#fee" filter="url(#shadow)"/>
                
                <!-- 驚嘆號背景圓 -->
                <circle cx="60" cy="60" r="45" fill="url(#errorGradient)"/>
                
                <!-- 驚嘆號 -->
                <rect x="55" y="30" width="10" height="40" rx="5" fill="white"/>
                <rect x="55" y="78" width="10" height="10" rx="5" fill="white"/>
                
                <!-- 裝飾性元素 -->
                <circle cx="25" cy="25" r="3" fill="#feb2b2" opacity="0.6"/>
                <circle cx="95" cy="25" r="3" fill="#feb2b2" opacity="0.6"/>
                <circle cx="25" cy="95" r="3" fill="#feb2b2" opacity="0.6"/>
                <circle cx="95" cy="95" r="3" fill="#feb2b2" opacity="0.6"/>
            </svg>
        </div>

        <h1 class="error-title">登入失敗</h1>
        
        <p class="error-message">
            查無此學生或帳密輸入錯誤！
        </p>
      
    </div>
  </div>

<div id="testData">
            <h3 style="color: #00796b; margin-bottom: 10px;"><i class="fas fa-history"></i> 歷年在本校段考資料</h3>
            <div class="table-container">



</div>







    <script>
        // 數字驗證函數
        function isNumberKey(evt) {
            var charCode = (evt.which) ? evt.which : evt.keyCode;
            if (charCode > 31 && (charCode < 48 || charCode > 57))
                return false;
            return true;
        }

        // 獲取按鈕和 div 的元素
        const button = document.getElementById("toggleButton");
        const testData = document.getElementById("testData");
        
        // 設定按鈕點擊事件
        button.onclick = function() {
            // 檢查 div 是否已顯示
            if (testData.style.display === "none" || testData.style.display === "") {
                testData.style.display = "block";  // 顯示 div
                button.innerHTML = "<i class='fas fa-eye-slash'></i> 隱藏歷年在本校段考資料";  // 更新按鈕文本
            } else {
                testData.style.display = "none";  // 隱藏 div
                button.innerHTML = "<i class='fas fa-chart-line'></i> 顯示歷年在本校段考資料";  // 更新按鈕文本
            }
        };
    </script>



</div>

</body>
</html>
